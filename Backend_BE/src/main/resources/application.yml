server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: helpdesk
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/helpdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

app:
  jwt:
    # override JWT_SECRET outside local development; must be at least 32 characters
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789-abcdefghijklmnop}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
