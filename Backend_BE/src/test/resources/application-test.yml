spring:
  datasource:
    url: jdbc:h2:mem:helpdesk;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-secret-for-unit-and-integration-tests-0123456789
    expiration-minutes: 60
  seed:
    enabled: false
